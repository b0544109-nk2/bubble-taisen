<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#ゆるふわっばぶるさっかー 対戦表</title>
<style>
  :root{
    --ink:#22252e;
    --paper:#fff8dc;
    --yellow:#ffd23f; --pink:#ff5ea8; --cyan:#33c4ff; --red:#ff5b4a;
    --green:#4bd06a; --blue:#4b7bff; --orange:#ff9f1c; --purple:#9b7bff;
    --line:#efe3b0;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    color:var(--ink);min-height:100vh;
    font-family:"Comic Sans MS","Chalkboard SE","Hiragino Maru Gothic ProN","Yu Gothic UI",system-ui,sans-serif;
    background-color:#fff3bf;
    background-image:
      radial-gradient(rgba(255,94,168,.16) 2.5px, transparent 2.6px),
      radial-gradient(rgba(51,196,255,.16) 2.5px, transparent 2.6px);
    background-size:34px 34px,34px 34px;
    background-position:0 0,17px 17px;
    -webkit-font-smoothing:antialiased;
  }
  /* 散りばめた絵文字クリップアート */
  .deco{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .deco span{position:absolute;font-size:44px;opacity:.9;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.12));animation:bob 6s ease-in-out infinite}
  .deco span:nth-child(1){left:4%;top:12%;transform:rotate(-12deg)}
  .deco span:nth-child(2){left:88%;top:8%;font-size:52px;animation-delay:-1s;transform:rotate(10deg)}
  .deco span:nth-child(3){left:82%;top:44%;animation-delay:-2s}
  .deco span:nth-child(4){left:6%;top:52%;font-size:40px;animation-delay:-3s;transform:rotate(8deg)}
  .deco span:nth-child(5){left:90%;top:78%;font-size:50px;animation-delay:-1.5s;transform:rotate(-8deg)}
  .deco span:nth-child(6){left:3%;top:84%;animation-delay:-2.5s}
  .deco span:nth-child(7){left:46%;top:5%;font-size:34px;animation-delay:-4s;transform:rotate(6deg)}
  .deco span:nth-child(8){left:70%;top:92%;font-size:38px;animation-delay:-3.5s}
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -12px}}
  @media (prefers-reduced-motion:reduce){.deco span,.imgdeco{animation:none}}
  /* いらすとや素材の散らし配置 */
  .imgdeco{position:fixed;z-index:0;pointer-events:none;opacity:.92;filter:drop-shadow(3px 4px 0 rgba(0,0,0,.08));animation:bob 7s ease-in-out infinite}
  .imgdeco.b1{left:1%;top:12%;width:120px}
  .imgdeco.b2{right:1%;top:9%;width:96px;animation-delay:-2s}
  .imgdeco.b3{right:2%;top:58%;width:104px;animation-delay:-4s}
  .imgdeco.b4{left:1%;bottom:7%;width:92px;animation-delay:-3s}
  @media (max-width:1080px){.imgdeco{display:none}}
  .hero{display:block;width:min(300px,74%);margin:10px auto 0;filter:drop-shadow(3px 4px 0 rgba(0,0,0,.10))}
  .cheer{display:block;width:min(150px,44%);margin:14px auto 0}

  .wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:30px 15px 70px}

  /* ヘッダー */
  header{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;margin:14px 0 4px;text-align:center}
  .titlewrap{flex:0 1 auto}
  .titleimg{flex:none;width:clamp(84px,22vw,132px);filter:drop-shadow(3px 4px 0 rgba(0,0,0,.10))}
  .kicker{display:inline-block;background:var(--cyan);color:#fff;border:3px solid var(--ink);
    border-radius:999px;padding:5px 16px;font-weight:800;font-size:.8rem;letter-spacing:.06em;
    box-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg);margin-bottom:16px}
  h1{margin:0;line-height:1.15}
  .h1-main{display:inline-block;background:var(--pink);color:#fff;border:4px solid var(--ink);
    border-radius:16px;padding:10px 18px;font-size:clamp(1.35rem,5.6vw,2.15rem);font-weight:800;
    box-shadow:6px 6px 0 var(--ink);transform:rotate(-1.5deg);
    text-shadow:2px 2px 0 rgba(0,0,0,.18)}
  .h1-sub{display:inline-block;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);
    border-radius:12px;padding:4px 16px;font-size:1rem;font-weight:800;letter-spacing:.28em;
    box-shadow:4px 4px 0 var(--ink);transform:rotate(1.5deg);margin-top:14px}
  .meta{text-align:center;margin:6px 0 0;color:#6a5a2a;font-weight:700;font-size:.85rem}

  /* シール風カード */
  .card{position:relative;background:#fff;border:4px solid var(--ink);border-radius:22px;
    padding:20px 18px 10px;margin:26px 0;box-shadow:7px 7px 0 var(--ink)}
  .card:nth-of-type(odd){transform:rotate(-.5deg)}
  .card:nth-of-type(even){transform:rotate(.5deg)}
  .card::after{content:attr(data-emoji);position:absolute;top:-20px;right:-12px;font-size:42px;
    transform:rotate(14deg);filter:drop-shadow(2px 2px 0 rgba(0,0,0,.15))}
  .card > h2{display:inline-flex;align-items:center;gap:8px;margin:0 0 16px;
    background:var(--yellow);border:3px solid var(--ink);border-radius:12px;
    padding:6px 14px;font-size:1rem;font-weight:800;box-shadow:3px 3px 0 var(--ink);transform:rotate(-1deg)}
  .rule{display:inline-block;margin:6px 0 12px 6px;background:#fff;border:2px dashed var(--ink);
    border-radius:10px;padding:3px 10px;color:#7a6a30;font-size:.75rem;font-weight:800}

  .tblwrap{overflow-x:auto}
  table{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
  th,td{padding:11px 9px;text-align:center;font-size:.94rem;white-space:nowrap}
  thead th{background:var(--cyan);color:#fff;font-weight:800;font-size:.74rem;letter-spacing:.06em;
    border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
  thead th:first-child{border-left:3px solid var(--ink);border-top-left-radius:10px;border-bottom-left-radius:10px}
  thead th:last-child{border-right:3px solid var(--ink);border-top-right-radius:10px;border-bottom-right-radius:10px}
  tbody td{border-bottom:2px dashed var(--line)}
  tbody tr:last-child td{border-bottom:none}
  td.name,th.name{text-align:left;white-space:normal}
  tbody tr:hover td{background:#fff7d6}
  .rank{width:2.7em;font-weight:800;color:#8a7a3a}
  .rank .medal{font-size:1.3rem}
  tr.top1 td{background:#fff2c0}
  .pts{font-weight:800;color:var(--red);font-size:1.05rem}
  .diff-pos{color:#2aa84a;font-weight:800}.diff-neg{color:var(--red);font-weight:800}

  .tag{display:inline-block;border-radius:999px;font-weight:800;color:#fff;font-size:.82rem;line-height:1;
    padding:6px 12px;white-space:nowrap;border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);
    text-shadow:1px 1px 0 rgba(0,0,0,.2)}
  .A{background:#e8503f}.B{background:#2f4bd8}.C{background:#f28c28}.D{background:#2fae44}.E{background:#20242f}

  .score{font-weight:800;font-size:1.15rem}
  .vs{color:#c9a94a;font-size:.8rem;padding:0 8px;font-weight:800}
  .pending{color:#b0a05a;font-size:.82rem;border:2px dashed var(--line);border-radius:8px;padding:2px 9px;font-weight:800}
  .win{color:var(--red)}

  .members{color:#6a5a2a;font-size:.84rem;font-weight:700}
  .status{text-align:right;color:#8a7a3a;font-size:.74rem;margin-top:10px;font-weight:700}
  .foot{color:#6a5a2a;font-size:.76rem;text-align:center;margin-top:24px;line-height:1.7;font-weight:700}
  .err{color:var(--red);font-size:.88rem;white-space:pre-wrap;padding:6px 2px;font-weight:800}
</style>
</head>
<body>
<div class="deco" aria-hidden="true">
  <span>⚽</span><span>🫧</span><span>🏆</span><span>🎉</span><span>✨</span><span>🥅</span><span>🦶</span><span>💥</span>
</div>
<img class="imgdeco b1" src="images/syabondama.png" alt="" aria-hidden="true">
<img class="imgdeco b2" src="images/sport_soccerball.png" alt="" aria-hidden="true">
<img class="imgdeco b3" src="images/syabondama.png" alt="" aria-hidden="true">
<img class="imgdeco b4" src="images/sport_soccerball.png" alt="" aria-hidden="true">
<div class="wrap">
  <header>
    <div class="titlewrap">
      <h1><span class="h1-main">#ゆるふわっばぶるさっかー</span></h1>
      <div><span class="h1-sub">対 戦 表</span></div>
    </div>
    <img class="titleimg" src="images/sports_bubble_soccer.png" alt="バブルサッカー">
  </header>
  <div class="meta" id="sub">読み込み中…</div>

  <section class="card" data-emoji="🏆">
    <h2>🏆 順位</h2><span class="rule" id="ruleNote"></span>
    <div class="tblwrap" id="rankBox"><div class="err" id="err"></div></div>
  </section>

  <section class="card" data-emoji="⚽">
    <h2>⚽ 試合</h2>
    <div class="tblwrap" id="matchBox"></div>
  </section>

  <section class="card" data-emoji="🙌">
    <h2>👥 チーム</h2>
    <div class="tblwrap" id="teamBox"></div>
  </section>

  <div class="status" id="status"></div>
  <img class="cheer" src="images/soccer_supporter_man.png" alt="がんばれ！">
</div>

<script>
// ?id=スプレッドシートID を付ければ別シートも表示できます。
var DEFAULT_ID = "1YUE7d5Sjs46XrgNtUjqxDIScDeRBe5-8qt7KqIjlf8w";
var params = new URLSearchParams(location.search);
var SHEET_ID = params.get("id") || DEFAULT_ID;
var GVIZ = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:csv";
var SETTINGS = { win:3, draw:1, loss:0 };

function parseCSV(text){
  var rows=[], row=[], cur="", i=0, q=false, c;
  while(i<text.length){
    c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    }else{
      if(c==='"') q=true;
      else if(c===',') { row.push(cur); cur=""; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(c==='\r'){ }
      else cur+=c;
    }
    i++;
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function num(v){ v=(v==null?"":String(v)); v=v.replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);}).replace(/　/g," ").trim(); if(v==="") return null; var n=Number(v); return isNaN(n)?null:n; }
function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
// 記号 + 半角スペース + チーム名（名前が空なら記号のみ）
function pill(sym,name){ var lbl = name ? esc(sym)+' '+esc(name) : esc(sym); return '<span class="tag '+esc(sym)+'">'+lbl+'</span>'; }

async function load(){
  try{
    var res = await fetch(GVIZ + "&_=" + Date.now());
    if(!res.ok) throw new Error("シート取得に失敗 (HTTP " + res.status + ")。共有が『リンクを知っている全員: 閲覧者』か確認してください。");
    var text = await res.text();
    var rows = parseCSV(text);
    var teams=[], matches=[];
    SETTINGS = { win:3, draw:1, loss:0 };
    for(var r=0;r<rows.length;r++){
      var col = rows[r].map(function(x){return (x==null?"":String(x)).trim();});
      var t = col[0];
      if(t==="勝点勝") SETTINGS.win = (num(col[1])!=null?num(col[1]):3);
      else if(t==="勝点分") SETTINGS.draw = (num(col[1])!=null?num(col[1]):1);
      else if(t==="勝点負") SETTINGS.loss = (num(col[1])!=null?num(col[1]):0);
      else if(t==="チーム"){ var _s=col[1]||"ABCDE".charAt(teams.length); teams.push({sym:_s, name:col[2]||"", members:col[3]||""}); }
      else if(t==="試合") matches.push({no:col[1], time:col[2], home:col[3], away:col[4], hs:num(col[5]), as:num(col[6])});
    }
    render(teams, matches);
    document.getElementById("err").textContent="";
    document.getElementById("status").textContent = "最終更新 " + new Date().toLocaleTimeString("ja-JP");
    var done = matches.filter(function(m){return m.hs!=null&&m.as!=null;}).length;
    document.getElementById("sub").textContent = teams.length + "チーム ・ 全" + matches.length + "試合（消化 " + done + "）";
  }catch(e){
    document.getElementById("err").textContent = "⚠ " + e.message;
    document.getElementById("sub").textContent = "読み込みエラー";
  }
}
function teamName(teams, sym){ for(var i=0;i<teams.length;i++) if(teams[i].sym===sym) return teams[i].name; return sym; }

function render(teams, matches){
  var st={};
  teams.forEach(function(t){ st[t.sym]={sym:t.sym,name:t.name,w:0,d:0,l:0,gf:0,ga:0}; });
  matches.forEach(function(m){
    if(m.hs==null||m.as==null) return;
    if(!st[m.home]||!st[m.away]) return;
    st[m.home].gf+=m.hs; st[m.home].ga+=m.as;
    st[m.away].gf+=m.as; st[m.away].ga+=m.hs;
    if(m.hs>m.as){ st[m.home].w++; st[m.away].l++; }
    else if(m.hs<m.as){ st[m.away].w++; st[m.home].l++; }
    else { st[m.home].d++; st[m.away].d++; }
  });
  var arr=Object.keys(st).map(function(k){
    var x=st[k];
    x.pts=x.w*SETTINGS.win + x.d*SETTINGS.draw + x.l*SETTINGS.loss;
    x.gd=x.gf-x.ga; x.played=x.w+x.d+x.l; return x;
  });
  arr.sort(function(a,b){ return b.pts-a.pts || b.gd-a.gd || b.gf-a.gf || a.sym.localeCompare(b.sym); });

  document.getElementById("ruleNote").textContent =
    "勝" + SETTINGS.win + " / 分" + SETTINGS.draw + " / 負" + SETTINGS.loss;

  var anyPlayed = arr.some(function(x){return x.played>0;});
  var medals=["🥇","🥈","🥉"];
  var h='<table><thead><tr><th class="rank">#</th><th class="name">チーム</th>'
       +'<th>勝</th><th>分</th><th>負</th><th>得</th><th>失</th><th>差</th><th>勝点</th></tr></thead><tbody>';
  arr.forEach(function(x,i){
    var rankCell = (anyPlayed && i<3) ? '<span class="medal">'+medals[i]+'</span>' : (i+1);
    var dcls = x.gd>0?'diff-pos':(x.gd<0?'diff-neg':'');
    h+='<tr class="'+(anyPlayed&&i===0?'top1':'')+'"><td class="rank">'+rankCell+'</td>'
      +'<td class="name">'+pill(x.sym,x.name)+'</td>'
      +'<td>'+x.w+'</td><td>'+x.d+'</td><td>'+x.l+'</td>'
      +'<td>'+x.gf+'</td><td>'+x.ga+'</td><td class="'+dcls+'">'+(x.gd>0?'+':'')+x.gd+'</td>'
      +'<td class="pts">'+x.pts+'</td></tr>';
  });
  h+='</tbody></table>';
  document.getElementById("rankBox").innerHTML=h;

  var m='<table><thead><tr><th>#</th><th class="name">対戦</th><th>スコア</th></tr></thead><tbody>';
  matches.forEach(function(x){
    var played=(x.hs!=null&&x.as!=null);
    var hw=played&&x.hs>x.as, aw=played&&x.as>x.hs;
    var score = played
      ? '<span class="score '+(hw?'win':'')+'">'+x.hs+'</span><span class="vs">-</span><span class="score '+(aw?'win':'')+'">'+x.as+'</span>'
      : '<span class="pending">未</span>';
    m+='<tr><td>'+esc(x.no)+'</td>'
      +'<td class="name">'+pill(x.home,teamName(teams,x.home))+' <span class="vs">vs</span> '+pill(x.away,teamName(teams,x.away))+'</td>'
      +'<td>'+score+'</td></tr>';
  });
  m+='</tbody></table>';
  document.getElementById("matchBox").innerHTML=m;

  var t='<table><thead><tr><th class="name">チーム</th><th class="name">メンバー</th></tr></thead><tbody>';
  teams.forEach(function(x){
    t+='<tr><td class="name">'+pill(x.sym,x.name)+'</td>'
      +'<td class="name members">'+esc(x.members||'—')+'</td></tr>';
  });
  t+='</tbody></table>';
  document.getElementById("teamBox").innerHTML=t;
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
